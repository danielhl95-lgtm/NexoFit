name: Build NexoFit 0.3 APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer NexoFit 0.3
        run: |
          rm -rf NexoFit
          unzip -q -o NexoFit-0.3-source.zip

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "Usando: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar ambas ediciones
        working-directory: NexoFit
        run: gradle :app:assembleStandardDebug :app:assemblePelvicDebug --stacktrace

      - name: Subir NexoFit 0.3 Standard
        uses: actions/upload-artifact@v4
        with:
          name: NexoFit-0.3-standard
          path: NexoFit/app/build/outputs/apk/standard/debug/app-standard-debug.apk

      - name: Subir NexoFit 0.3 Plus
        uses: actions/upload-artifact@v4
        with:
          name: NexoFit-0.3-plus
          path: NexoFit/app/build/outputs/apk/pelvic/debug/app-pelvic-debug.apk
